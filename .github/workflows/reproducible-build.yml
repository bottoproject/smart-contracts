name: Reproducible V3 build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test build-manifest generation
        run: npm run test:build

      - name: Build twice and compare bytecode manifests
        run: |
          npm run build:reproducible
          cp deployments/builds/BottoLiquidityMiningV3.json "$RUNNER_TEMP/first-build.json"
          npm run build:reproducible
          cmp "$RUNNER_TEMP/first-build.json" deployments/builds/BottoLiquidityMiningV3.json

      - name: Verify committed manifest
        run: git diff --exit-code -- deployments/builds/BottoLiquidityMiningV3.json

      - name: Run V3 upgrade and behavior tests
        run: npm run test:v3

      - name: Upload deployment build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: botto-liquidity-mining-v3-${{ github.sha }}
          path: |
            build/contracts/BottoLiquidityMiningV3.json
            deployments/builds/BottoLiquidityMiningV3.json
          if-no-files-found: error
          retention-days: 30
